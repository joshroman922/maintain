<!DOCTYPE html>
<html lang="en" style="background:#03070c">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dawn">
<meta name="theme-color" content="#03070c">
<title>Dawn</title>
<style>
:root{--void:#03070c;--panel:rgba(10,20,30,.86);--line:rgba(90,210,230,.22);--cyan:#5ad6e6;--hot:#bff4ff;--ink:#dcecf3;--dim:#7794a6;--mono:ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--void);color:var(--ink);font-family:var(--sans);min-height:100dvh;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.app{max-width:440px;margin:0 auto}
.brand{font:11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
h1{font-size:28px;margin-bottom:8px}
.why{color:var(--dim);font-size:14px;line-height:1.45;margin-bottom:16px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin-bottom:10px}
.step{font-size:15px;padding:10px 0;border-bottom:1px solid rgba(90,210,230,.12)}
.step:last-child{border-bottom:none}
a.btn{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);background:rgba(90,214,230,.14);color:var(--hot);border-radius:12px;padding:14px;font-weight:650;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="brand">Maintain · Dawn</div>
  <h1>Morning</h1>
  <p class="why">No timer. Do the next thing. Then go.</p>
  <div class="card">
    <div class="step">1. Water</div>
    <div class="step">2. Light on your face</div>
    <div class="step">3. Field Protocol — 4-7-8 or 6-3-9</div>
    <div class="step">4. One work move before the phone feed</div>
  </div>
  <a class="btn" href="field.html">Open Field Protocol</a>
  <a class="btn" href="index.html">Back to Hub</a>
</div>
</body>
</html>
