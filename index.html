<!DOCTYPE html>
<html lang="en" style="background:#03070c">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maintain">
<meta name="theme-color" content="#03070c">
<title>Maintain</title>
<style>
:root{--void:#03070c;--cyan:#5ad6e6;--ink:#dcecf3;--dim:#7794a6;--sans:-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--void);color:var(--ink);font-family:var(--sans);min-height:100vh}
.stage{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(60% 45% at 50% 28%,rgba(90,214,230,.22),transparent 58%),radial-gradient(rgba(90,214,230,.08) 1px,transparent 1px);background-size:auto,24px 24px}
#orbit{position:absolute;left:50%;top:48%;z-index:8;width:0;height:0}
.ring{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.ring.r1{width:280px;height:280px;border:1.5px solid rgba(140,250,255,.55);box-shadow:0 0 24px rgba(90,214,230,.35)}
.ring.r2{width:234px;height:234px;border:1px dashed rgba(90,214,230,.32);animation:spin 48s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 28%,#f0ffff,#5ad6e6 28%,#0a2a38 78%);border:2.5px solid rgba(200,255,255,.98);box-shadow:0 0 32px rgba(90,214,230,.85)}
.node{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:10;border-radius:50%;border:1.5px solid rgba(120,230,250,.35);background:radial-gradient(circle at 42% 28%,rgba(40,70,90,.95),rgba(4,12,18,.98));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 22px rgba(0,0,0,.55)}
.node .cap{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);width:90px;text-align:center;font:600 10px/1.2 var(--sans);color:var(--ink)}
#cmd-belt{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:40;display:flex;gap:12px;padding:12px 18px;background:rgba(4,12,20,.82);border:1.5px solid rgba(140,250,255,.55);border-radius:42px}
.cmd-btn{width:50px;height:50px;border-radius:50%;border:1.5px solid rgba(110,230,250,.55);background:radial-gradient(circle at 42% 28%,rgba(40,70,90,.97),rgba(8,18,28,.98));color:#5ad6e6;display:grid;place-items:center;font-size:22px;cursor:pointer}
#gears-btn{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:40;width:58px;height:58px;border-radius:50%;border:2px solid rgba(140,250,255,.7);background:rgba(4,12,20,.95);color:#5ad6e6;display:grid;place-items:center;font-size:24px;cursor:pointer}
#msg{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:50;width:90vw;max-width:360px;padding:16px;background:rgba(8,18,28,.96);border:1px solid rgba(90,214,230,.4);border-radius:16px;text-align:center;line-height:1.45;font-size:14px}
</style>
</head>
<body>
<div class="stage"><div id="orbit"><div class="ring r1"></div><div class="ring r2"></div><div class="core"></div></div></div>
<button id="gears-btn">⚙</button>
<div id="cmd-belt">
<button class="cmd-btn" id="cmd-phone">📞</button>
<button class="cmd-btn" id="cmd-msg">💬</button>
<button class="cmd-btn" id="cmd-cam">📷</button>
<button class="cmd-btn" id="cmd-ai">🤖</button>
</div>
<div id="msg"><b style="color:#5ad6e6">Site restored (simplified)</b><br><br>Full clock + routine version is in Grok. Open the file there, copy all, then use GitHub website Edit on index.html to paste if ⑆ is missing.<br><br><span style="color:#7794a6;font-size:12px">Bottom buttons still open Shortcuts.</span></div>
<script>
"use strict";
var nodes=[{icon:"💬",label:"Social",x:-110,y:-90},{icon:"🩺",label:"Health",x:110,y:-90},{icon:"🔄",label:"Routine",x:130,y:20},{icon:"🔧",label:"Work",x:70,y:110},{icon:"📁",label:"Files",x:-70,y:110},{icon:"📓",label:"Study",x:-130,y:20}];
var orbit=document.getElementById("orbit");
nodes.forEach(function(n){var el=document.createElement("div");el.className="node";el.style.transform="translate("+n.x+"px,"+n.y+"px)";el.innerHTML=n.icon+'<div class="cap">'+n.label+'</div>';orbit.appendChild(el);});
function sc(name){location.href="shortcuts://run-shortcut?name="+encodeURIComponent(name);}
document.getElementById("cmd-phone").onclick=function(){sc("Maintain Contacts");};
document.getElementById("cmd-msg").onclick=function(){sc("Maintain Messages");};
document.getElementById("cmd-cam").onclick=function(){sc("Maintain Camera");};
document.getElementById("cmd-ai").onclick=function(){sc("Maintain Gemini");};
document.getElementById("gears-btn").onclick=function(){sc("Maintain Settings");};
</script>
</body>
</html>
