<script>
(function(){
  var u='https://cdn.jsdelivr.net/gh/joshroman922/maintain@1dfbdb68229332ff3eaa387bc1e90190ec513269/index.html';
  fetch(u,{cache:'no-store'}).then(function(r){return r.text();}).then(function(html){
    document.open();
    document.write(html);
    document.close();
  }).catch(function(){
    document.getElementById('boot').style.display='block';
  });
  setTimeout(function(){
    if(!document.getElementById('orbit')){
      var b=document.getElementById('boot');
      if(b) b.style.display='block';
    }
  }, 4000);
})();
</script>
